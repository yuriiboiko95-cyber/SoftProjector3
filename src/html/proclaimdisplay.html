<html>

<head>
    <title>SoftProjector - Proclaim Display</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .layer.no-transition {
            transition: none;
        }

        .layer.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <img id="bg1" class="layer">
    <img id="bg2" class="layer">
    <img id="text1" class="layer">
    <img id="text2" class="layer">

    <script type="text/javascript">
        var wsUri = "ws://${ipAddress}:${webSocketPort}";
        var websocket = null;
        var reconnectDelay = 1000;
        var reconnectTimer = null;

        var bgCurrent = 1;
        var textCurrent = 1;

        // Swaps in a new image on the hidden buffer of the given layer pair,
        // cross-fading it in once loaded (or snapping instantly if useFading
        // is false). Returns the index that is now the visible buffer.
        function swapImage(prefix, currentIndex, newSrc, useFading) {
            var nextIndex = currentIndex === 1 ? 2 : 1;
            var currentEl = document.getElementById(prefix + currentIndex);
            var nextEl = document.getElementById(prefix + nextIndex);

            currentEl.classList.toggle('no-transition', !useFading);
            nextEl.classList.toggle('no-transition', !useFading);

            nextEl.onload = function () {
                nextEl.classList.add('visible');
                currentEl.classList.remove('visible');
            };
            nextEl.src = newSrc;

            return nextIndex;
        }

        function displayBibleImages(msg) {
            bgCurrent = swapImage('bg', bgCurrent, msg.backgroundImage, msg.useFading);
            textCurrent = swapImage('text', textCurrent, msg.textImage, msg.useFading);
        }

        function clearImages() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            ['bg1', 'bg2', 'text1', 'text2'].forEach(function (id) {
                document.getElementById(id).classList.remove('visible');
            });
        }

        function displayText(data) {
            try {
                var msg = JSON.parse(data);
                if (msg.textImage !== undefined) {
                    displayBibleImages(msg);
                } else {
                    clearImages();
                }
            } catch (e) {
                console.log('Failed to parse websocket payload:', e, data);
                clearImages();
            }
        }

        function reconnectWebSocket() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }
            reconnectTimer = setTimeout(function () {
                reconnectTimer = null;
                initWebSocket();
            }, reconnectDelay);
        }

        function initWebSocket() {
            try {
                if (typeof MozWebSocket == 'function')
                    WebSocket = MozWebSocket;
                if (websocket && websocket.readyState == 1)
                    websocket.close();
                websocket = new WebSocket(wsUri);
                websocket.onmessage = function (event) {
                    displayText(event.data);
                };
                websocket.onerror = function (evt) {
                    console.log('ERROR: ' + evt.data);
                };
                websocket.onclose = function () {
                    clearImages();
                    reconnectWebSocket();
                };
            } catch (exception) {
                console.log('ERROR: ' + exception);
            }
        }

        function stopWebSocket() {
            if (websocket)
                websocket.close();
        }

        window.onload = (event) => {
            initWebSocket();
        };
    </script>
</body>

</html>
